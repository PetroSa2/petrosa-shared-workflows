# yamllint disable rule:line-length rule:truthy rule:document-start
# Reusable workflow — Request GitHub Copilot review after CI passes.
#
# Callers: each Petrosa service repo's .github/workflows/request-copilot-review.yml
# Caller keeps its own `on: workflow_run / workflow_dispatch` trigger + `if:` guard.
# This reusable workflow contains only the job body.
#
# Fixes carried in from canonical binance-data-extractor source:
#   F1/F2: dispatch-path detection via PR_NUMBER_INPUT env var (not context.eventName
#          or core.getInput, which behave differently inside workflow_call context).
#   F25:   Dead headSha variable removed from both PR-resolution branches.
#   Draft gate: pr.draft === true → skip (Copilot not requested for draft PRs).
#
# Gate: merge blocking is handled by copilot-review-gate.yml (reusable), which posts
# a check_run named `copilot-review` on the PR head SHA.
# See petrosa_k8s/docs/COPILOT_REVIEW_ENFORCEMENT.md.

name: Request Copilot Review (reusable)

on:
  workflow_call:
    inputs:
      dispatch-pull-number:
        description: 'PR number when caller was triggered by workflow_dispatch. Leave empty for workflow_run callers.'
        type: string
        required: false
        default: ''

jobs:
  request-copilot-review:
    runs-on: petrosa-org-runners
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Request Copilot Review
        uses: actions/github-script@v7
        env:
          # F1/F2: Inside workflow_call, context.eventName is the CALLER's trigger
          # (e.g. 'workflow_run'), never 'workflow_dispatch'. core.getInput() reads
          # action-level inputs only, not workflow_call inputs. Use this env var to
          # pass the dispatch PR number and detect the dispatch path reliably.
          PR_NUMBER_INPUT: ${{ inputs.dispatch-pull-number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            // F1/F2: Detect dispatch path via env var, not context.eventName.
            const isDispatch = (process.env.PR_NUMBER_INPUT || '').trim() !== '';

            let pull_number;
            let pr;

            if (isDispatch) {
              pull_number = parseInt(process.env.PR_NUMBER_INPUT, 10);
              if (!Number.isInteger(pull_number) || pull_number <= 0) {
                core.setFailed(`Invalid dispatch-pull-number: must be a positive integer, got "${process.env.PR_NUMBER_INPUT}".`);
                return;
              }
              // Fetch and validate the PR exists and is not a fork.
              const { data: fetchedPr } = await github.rest.pulls.get({ owner, repo, pull_number });
              if (fetchedPr.head.repo.full_name !== `${owner}/${repo}`) {
                console.log(`Skipping fork PR from ${fetchedPr.head.repo.full_name}`);
                return;
              }
              pr = fetchedPr;
            } else {
              // workflow_run.pull_requests[] is unreliable — resolve the PR by
              // matching head_sha + head_branch via the REST API instead.
              // Fix for Issue #371: workflow_run.pull_requests[] is always empty in
              // GitHub's event payload even for same-repo PRs.
              const run = context.payload.workflow_run;
              const prs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open',
                head: `${owner}:${run.head_branch}`,
                per_page: 100,
              });
              pr = prs.find(
                (p) => p.head.sha === run.head_sha &&
                        p.head.repo.full_name === `${owner}/${repo}`
              );
              if (!pr) {
                console.log(`No open same-repo PR for ${run.head_branch}@${run.head_sha}; skipping.`);
                return;
              }
              pull_number = pr.number;
            }

            // Draft gate: Copilot is not requested for draft PRs.
            // When the PR is marked ready-for-review, ci-checks.yml fires a new CI run
            // (via the ready_for_review trigger added by Task 7), which fires this
            // workflow again — at that point pr.draft === false and Copilot is requested.
            if (pr.draft === true) {
              console.log(`PR #${pull_number} is a draft; skipping Copilot review request.`);
              return;
            }

            // Short-circuit: skip if Copilot has already submitted any review on this PR.
            // One Copilot review per PR is the correct standard (#380) — re-review via
            // API is a no-op (requestReviewers returns 200 but fires no review_requested
            // event for Copilot). The thread-resolution check in the gate is the real
            // quality enforcement; requesting again would have no effect.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number, per_page: 100,
            });
            const isCopilot = (login) => {
              const l = (login || '').toLowerCase();
              return l === 'copilot-pull-request-reviewer' || l.startsWith('copilot-pull-request-reviewer[');
            };
            const alreadyReviewed = reviews.some(
              (r) => isCopilot(r.user?.login) &&
                r.state !== 'DISMISSED' && r.state !== 'PENDING'
            );
            if (alreadyReviewed) {
              console.log(`Copilot already reviewed this PR; skipping re-request.`);
              return;
            }

            console.log(`Requesting Copilot review for PR #${pull_number}...`);

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number,
                reviewers: ['github-copilot'],
              });
              console.log(`Requested Copilot review for PR #${pull_number}`);
            } catch (error) {
              // 422 = Copilot unavailable or already in review queue; safe to ignore.
              // All other errors are re-thrown so the step fails visibly.
              if (error.status !== 422) throw error;
              console.log('Copilot already requested or unavailable (422); continuing.');
            }
