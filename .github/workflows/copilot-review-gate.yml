# yamllint disable rule:line-length rule:truthy rule:document-start
# Reusable workflow — Copilot review gate (enforces merge blocking).
#
# Callers: each Petrosa service repo's .github/workflows/copilot-review-gate.yml
# Caller keeps its own `on: workflow_run / workflow_dispatch` trigger + `if:` guard.
# This reusable workflow contains only the job body.
#
# Branch protection must require the check name: copilot-review
# (matches the job name below). See petrosa_k8s/docs/COPILOT_REVIEW_ENFORCEMENT.md.
#
# NOTE (PetroSa2/petrosa_k8s#559): pull_request_review trigger deliberately absent
# from callers — Copilot Bot account triggers the fork-pr-contributor-approval banner.
# Triggered from "CI Checks" (one workflow_run hop) not "Request Copilot Review"
# (two hops, which collapses head_sha to default branch HEAD — see #698).
#
# F11/TD#9: concurrency group evaluates with github.repository = the caller repo's
# name, so each caller repo has its own queue; concurrent runs across repos do not
# interfere. cancel-in-progress: false is preserved (#362 regression prevention).
#
# FM-7 (PetroSa2/petrosa-shared-workflows#4): the gate runs an "unrecoverable"
# classifier (bot login unresolvable, request-side workflow failed) BEFORE the
# polling loop and exits neutral immediately if either signal fires. The poll
# itself is bounded to 10 minutes (down from 20) and exits neutral on timeout,
# not failure. FM-6's self-error fast-path remains SUCCESS-with-annotation as
# PR #5 chose.

name: Copilot Review Gate (reusable)

on:
  workflow_call:
    inputs:
      dispatch-pull-number:
        description: 'PR number when caller was triggered by workflow_dispatch. Leave empty for workflow_run callers.'
        type: string
        required: false
        default: ''

concurrency:
  # Queue new gate runs — never cancel an in-flight run.
  # cancel-in-progress: true caused a regression (#362): the pull_request_review event
  # cancelled the existing polling run that was about to succeed, and the replacement
  # run failed due to API propagation delay. F26: under cancel-in-progress: false, a
  # queued run waiting is safer than a cancelled run leaving a dangling in_progress
  # check_run.
  group: copilot-review-${{ github.repository }}-${{ github.event.workflow_run.pull_requests[0].number || inputs.dispatch-pull-number || github.run_id }}
  cancel-in-progress: false

jobs:
  copilot-review:
    name: copilot-review
    runs-on: petrosa-org-runners
    permissions:
      contents: read
      pull-requests: read
      checks: write
    env:
      # GitHub Actions deprecates Node.js 20 for JS actions in 2026; opt into Node 24 early.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Verify Copilot review and resolved threads
        uses: actions/github-script@v7
        env:
          # Kill-switch: COPILOT_REVIEW_ENABLED passed via env so the script can read it.
          COPILOT_REVIEW_ENABLED: ${{ vars.COPILOT_REVIEW_ENABLED }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function resolvePullRequest() {
              if (context.eventName === 'workflow_dispatch') {
                const pull_number_input = parseInt(context.payload.inputs?.pull_number, 10);
                if (!Number.isInteger(pull_number_input) || pull_number_input <= 0) {
                  core.setFailed('workflow_dispatch requires a valid pull_number input');
                  return null;
                }
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pull_number_input });
                return pr;
              }
              if (context.eventName === 'workflow_run') {
                const run = context.payload.workflow_run;
                const prs = await github.paginate(github.rest.pulls.list, {
                  owner, repo, state: 'open',
                  head: `${owner}:${run.head_branch}`,
                  per_page: 100,
                });
                const pr = prs.find(
                  (p) => p.head.sha === run.head_sha &&
                          p.head.repo.full_name === `${owner}/${repo}`
                );
                if (!pr) {
                  core.info(`No open same-repo PR for ${run.head_branch}@${run.head_sha}; skipping.`);
                  return null;
                }
                return pr;
              }
              core.info(`Unhandled event ${context.eventName}; skipping.`);
              return null;
            }

            const pr = await resolvePullRequest();
            if (!pr) {
              return;
            }

            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.info(`Skipping fork PR ${pr.head.repo.full_name}`);
              return;
            }

            const pull_number = pr.number;
            const headSha = pr.head.sha;

            // workflow_run-triggered runs attach their natural check_run to the
            // workflow file's commit (default branch HEAD), NOT to the PR head.
            // Branch protection looks at PR head checks only — so we explicitly
            // create a check_run on the PR head SHA here. This decouples the
            // gate-result check from the trigger event's SHA.
            // See PetroSa2/petrosa_k8s#559 for the full rationale.
            let gateCheckRunId = null;
            try {
              const { data: createdCheck } = await github.rest.checks.create({
                owner,
                repo,
                name: 'copilot-review',
                head_sha: headSha,
                status: 'in_progress',
                started_at: new Date().toISOString(),
                output: {
                  title: 'Copilot review gate',
                  summary: `Polling for Copilot review and verifying thread resolution on ${headSha}.`,
                },
              });
              gateCheckRunId = createdCheck.id;
              core.info(`Created copilot-review check_run ${gateCheckRunId} on PR head ${headSha}.`);
            } catch (err) {
              core.warning(`Could not create check_run on PR head: ${err.message}`);
            }

            async function finalizeCheck(conclusion, summary) {
              if (!gateCheckRunId) return;
              try {
                await github.rest.checks.update({
                  owner,
                  repo,
                  check_run_id: gateCheckRunId,
                  status: 'completed',
                  conclusion,
                  completed_at: new Date().toISOString(),
                  output: {
                    title: 'Copilot review gate',
                    summary,
                  },
                });
              } catch (err) {
                core.warning(`Could not finalize check_run: ${err.message}`);
              }
            }

            // Kill-switch short-circuit (PetroSa2/petrosa_k8s#793): when
            // COPILOT_REVIEW_ENABLED is absent/empty/false (not exactly 'true'),
            // immediately finalize the copilot-review check as 'success' and
            // return — no polling loop, no review request, no 10-minute wait.
            // This keeps the required check GREEN so PRs are never blocked.
            // The job MUST run (never skip at job level) so the check_run posts.
            const killSwitch = (process.env.COPILOT_REVIEW_ENABLED || '').trim();
            if (killSwitch !== 'true') {
              const msg = 'Copilot review disabled org-wide via COPILOT_REVIEW_ENABLED kill-switch ' +
                '(Copilot billing/quota exhausted). Gate auto-passes; no review requested.';
              core.info(msg);
              await finalizeCheck('success', msg);
              return;
            }

            const isCopilotPrReviewer = (login) => {
              if (!login) return false;
              const l = String(login).toLowerCase();
              return (
                l === 'copilot-pull-request-reviewer' ||
                l.startsWith('copilot-pull-request-reviewer[')
              );
            };

            // FM-6 (petrosa_k8s#767): Copilot's self-error template is a state=COMMENTED
            // review whose body begins with this exact phrase. The phrase is byte-for-byte
            // invariant across the 50+ org-wide PRs that hit this failure mode.
            const COPILOT_SELF_ERROR_PREFIX = 'Copilot encountered an error and was unable to review this pull request';
            const isCopilotSelfErrorReview = (review) => {
              if (!review || review.state !== 'COMMENTED') return false;
              const body = review.body || '';
              return body.startsWith(COPILOT_SELF_ERROR_PREFIX);
            };

            async function hasCopilotReview() {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number,
                per_page: 100,
              });

              // Classify reviews. Three buckets matter to the gate:
              //   1) a real Copilot review (state in {APPROVED, CHANGES_REQUESTED, COMMENTED-non-self-error})
              //      → gate passes via the normal happy path.
              //   2) a Copilot self-error review ON THE CURRENT HEAD SHA
              //      → gate passes with a self-error annotation (don't block on Copilot
              //        infrastructure failure — the operator didn't cause it). Freshness
              //        matters: a self-error from a previous commit must NOT bypass the
              //        gate for a subsequent commit.
              //   3) nothing yet → keep waiting, then time-fail.
              // Without bucket (2) the gate hangs every PR whenever Copilot's backend
              // crashes; org-wide outages would block all merges. With bucket (2) the
              // failure mode is loud (warning + annotated SUCCESS) but non-blocking.
              let sawSelfErrorOnHead = false;
              let found = false;
              for (const r of reviews) {
                if (!r.user || !isCopilotPrReviewer(r.user.login)) continue;
                if (r.state === 'DISMISSED' || r.state === 'PENDING') continue;
                if (isCopilotSelfErrorReview(r)) {
                  if (r.commit_id === headSha) sawSelfErrorOnHead = true;
                  continue;
                }
                found = true;
              }
              return { found, sawSelfErrorOnHead };
            }

            // FM-7 (petrosa-shared-workflows#4): unrecoverable-signal classifier.
            // Two signals that mean "no Copilot review document can arrive for
            // this commit". If either fires, the gate exits neutral immediately
            // instead of polling for the full hard-timeout window.
            //
            // (FM-6's self-error signal on HEAD is intentionally NOT folded in
            // here — it stays in the in-loop path so its conclusion remains
            // SUCCESS with annotation, as PR #5 deliberately chose.)
            async function detectUnrecoverableSignal() {
              // Signal A: configured bot login does not resolve in this repo.
              // If the Copilot bot account is not addressable here, the request
              // workflow could not have added it as a reviewer, and no review
              // document will ever arrive.
              try {
                const probe = await github.graphql(
                  `query($login: String!, $owner: String!, $name: String!) {
                    user(login: $login) { login }
                    repository(owner: $owner, name: $name) {
                      assignableUsers(query: $login, first: 5) { nodes { login } }
                    }
                  }`,
                  { login: 'copilot-pull-request-reviewer', owner, name: repo }
                );
                const userResolves = !!(probe && probe.user && probe.user.login);
                const assignable = probe?.repository?.assignableUsers?.nodes || [];
                if (!userResolves && assignable.length === 0) {
                  return {
                    signal: 'bot-unresolvable',
                    summary:
                      `Bot login 'copilot-pull-request-reviewer' does not resolve in ${owner}/${repo} ` +
                      `(no User and no assignableUsers match). No Copilot review can arrive for this commit.`,
                  };
                }
              } catch (err) {
                core.warning(`FM-7 bot-login probe failed (non-fatal): ${err.message}`);
              }

              // Signal B: most recent request-copilot-review.yml run on this
              // PR's HEAD SHA concluded failure or cancelled. If the request
              // side never succeeded, Copilot was never asked.
              try {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: 'request-copilot-review.yml',
                  head_sha: headSha,
                  per_page: 5,
                });
                const recent = (runs.data?.workflow_runs || [])
                  .filter((r) => r.head_sha === headSha)
                  .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
                if (recent && (recent.conclusion === 'failure' || recent.conclusion === 'cancelled')) {
                  return {
                    signal: 'request-side-failed',
                    summary:
                      `request-copilot-review.yml most recent run on ${headSha} concluded ` +
                      `'${recent.conclusion}' (${recent.html_url}). Copilot was not added as a reviewer; ` +
                      `no review will arrive.`,
                  };
                }
              } catch (err) {
                core.warning(`FM-7 request-workflow probe failed (non-fatal): ${err.message}`);
              }

              return null;
            }

            // FM-7 fast-path: if Copilot review structurally cannot arrive for
            // this commit, exit neutral before entering the polling loop.
            const unrecoverable = await detectUnrecoverableSignal();
            if (unrecoverable) {
              const exitMsg = `Copilot review gate exiting neutral (${unrecoverable.signal}): ${unrecoverable.summary}`;
              core.warning(exitMsg);
              await finalizeCheck('neutral', exitMsg);
              return;
            }

            // Copilot reviews are asynchronous and often land after CI completes and after the
            // review request workflow runs. To avoid flaky "rerun until Copilot posts" behavior,
            // poll for a bounded time before failing.
            const maxWaitSeconds = 10 * 60; // 10 minutes (FM-7: shorter wait, neutral exit on timeout)
            const pollIntervalSeconds = 30;
            let waited = 0;

            while (waited <= maxWaitSeconds) {
              const review = await hasCopilotReview();
              if (review.found) {
                core.info(`Found submitted Copilot review for PR #${pull_number} @ ${headSha}.`);
                break;
              }

              if (review.sawSelfErrorOnHead) {
                // FM-6 (petrosa_k8s#767): Copilot reviewed the current head but its
                // backend errored. That is a Copilot-infrastructure failure, not a
                // PR-quality signal — passing the gate (with a loud annotation) is
                // strictly better than blocking every merge during a Copilot outage.
                // The annotated SUCCESS distinguishes this from a "real review approved"
                // pass, and the workflow log carries a warning. Operators who want a
                // real review before merge can re-request Copilot and re-run the gate.
                const passMsg = `Copilot review gate passed with self-error annotation ` +
                  `(FM-6, petrosa_k8s#767): Copilot submitted a self-error review on ${headSha} ` +
                  `("Copilot encountered an error and was unable to review this pull request"). ` +
                  `The gate does not block on Copilot infrastructure failures. ` +
                  `If a real Copilot review is desired before merge, re-request Copilot review ` +
                  `(GitHub UI → Reviewers → Re-request) and re-run this workflow.`;
                core.warning(passMsg);
                await finalizeCheck('success', passMsg);
                return;
              }

              if (waited === 0) {
                core.info(
                  `Waiting for Copilot PR review on current head ${headSha} (polling up to ${maxWaitSeconds}s).`
                );
              }

              if (waited >= maxWaitSeconds) {
                // FM-7 (petrosa-shared-workflows#4): timed-out without a review
                // document — exit neutral, not failure. The gate cannot
                // distinguish "Copilot is rate-limited" from "Copilot is slow",
                // so blocking the merge isn't justified. Operator can
                // re-request review and re-run if a real verdict is wanted.
                const msg = `Timed out waiting for Copilot review after ${maxWaitSeconds}s (10m). ` +
                  `No review document arrived for ${headSha}. ` +
                  `Gate exits neutral (non-blocking); re-request Copilot review and re-run if a real review is wanted before merge.`;
                core.warning(msg);
                await finalizeCheck('neutral', msg);
                return;
              }

              await new Promise((r) => setTimeout(r, pollIntervalSeconds * 1000));
              waited += pollIntervalSeconds;
            }

            async function loadAllReviewThreads() {
              const threadQuery = `query ($owner: String!, $repoName: String!, $pull: Int!, $tcursor: String) {
                repository(owner: $owner, name: $repoName) {
                  pullRequest(number: $pull) {
                    reviewThreads(first: 100, after: $tcursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        isResolved
                        isOutdated
                        comments(first: 100) {
                          nodes { author { login } }
                        }
                      }
                    }
                  }
                }
              }`;

              const threadsOut = [];
              let tCursor = null;
              for (let p = 0; p < 20; p++) {
                const tr = await github.graphql(threadQuery, {
                  owner,
                  repoName: repo,
                  pull: pull_number,
                  tcursor: tCursor,
                });
                const conn = tr.repository?.pullRequest?.reviewThreads;
                const nodes = conn?.nodes || [];
                for (const t of nodes) {
                  const commentNodes = t.comments?.nodes || [];
                  // Only track the thread-starter (first comment author) to avoid
                  // blocking on human threads where Copilot later replies.
                  const starterLogin = commentNodes.length > 0
                    ? commentNodes[0].author?.login
                    : null;
                  threadsOut.push({
                    isResolved: t.isResolved,
                    isOutdated: t.isOutdated,
                    starterLogin,
                  });
                }
                if (!conn?.pageInfo?.hasNextPage) break;
                tCursor = conn.pageInfo.endCursor;
              }
              return threadsOut;
            }

            const threads = await loadAllReviewThreads();

            const isCopilotAuthor = (login) => {
              if (!login) return false;
              const l = String(login).toLowerCase();
              return (
                l === 'copilot' ||
                l === 'copilot-pull-request-reviewer' ||
                l.startsWith('copilot-pull-request-reviewer[')
              );
            };

            const unresolved = [];
            for (const t of threads) {
              if (t.isOutdated) continue;
              // A "Copilot thread" is one started by Copilot (first comment author).
              // This avoids blocking on human threads where Copilot later replies.
              const copilotThread = isCopilotAuthor(t.starterLogin);
              if (copilotThread && !t.isResolved) {
                unresolved.push('unresolved Copilot thread');
              }
            }

            if (unresolved.length > 0) {
              const msg = 'One or more Copilot review threads are still unresolved. Resolve or justify each thread in the PR before merge.';
              await finalizeCheck('failure', msg);
              core.setFailed(msg);
              return;
            }

            await finalizeCheck('success', `Copilot review gate passed for ${repo}#${pull_number} @ ${headSha}.`);
            core.info(
              `Copilot review gate passed for ${repo}#${pull_number} @ ${headSha}.`
            );
